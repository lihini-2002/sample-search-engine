<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Findly Search</title>
<style>
/* Layout: two views — centered home (logo + search box) and a results page with a sticky header bar and a 650px results column */
:root {
  --bg: #ffffff;
  --fg: #1f1f1f;
  --muted: #5f6368;
  --line: #e3e5e8;
  --field: #ffffff;
  --hover: #f3f4f6;
  --link: #1a4fc4;
  --visited: #6a3fb0;
  --url: #2c6e49;
  --accent: #e8590c;
  --shadow: 0 1px 6px rgba(32, 33, 36, 0.18);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --line: #3c4043; --field: #303134;
    --hover: #2a2b2e; --link: #8ab4f8; --visited: #c58af9; --url: #7fcf9c; --accent: #ff8a3d;
    --shadow: 0 1px 6px rgba(0,0,0,0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --line: #3c4043; --field: #303134;
  --hover: #2a2b2e; --link: #8ab4f8; --visited: #c58af9; --url: #7fcf9c; --accent: #ff8a3d;
  --shadow: 0 1px 6px rgba(0,0,0,0.5); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: var(--link); text-decoration: none; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
svg { display: block; }

.logo { font-weight: 800; letter-spacing: -0.03em; color: var(--fg); display: inline-flex; align-items: baseline; }
.logo .dot { color: var(--accent); }

/* Search field (shared) */
.field { position: relative; width: 100%; }
.bar { display: flex; align-items: center; gap: 10px; background: var(--field); border: 1px solid var(--line); border-radius: 24px; padding: 0 8px 0 16px; height: 46px; }
.bar:hover, .bar:focus-within { box-shadow: var(--shadow); border-color: transparent; }
.field.open .bar { border-radius: 24px 24px 0 0; box-shadow: var(--shadow); border-color: transparent; }
.bar > svg { width: 20px; height: 20px; color: var(--muted); flex-shrink: 0; }
.q { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--fg); font: inherit; font-size: 16px; height: 100%; }
.clear { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.clear:hover { background: var(--hover); }
.clear svg { width: 18px; height: 18px; }
.sugg { position: absolute; top: 100%; left: 0; right: 0; background: var(--field); border-radius: 0 0 24px 24px; box-shadow: 0 4px 6px rgba(32,33,36,.18); padding: 4px 0 12px; z-index: 30; border-top: 1px solid var(--line); }
.sugg button { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 6px 18px; }
.sugg button:hover, .sugg button.hl { background: var(--hover); }
.sugg svg { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }

/* Home */
.home { min-height: 100vh; display: flex; flex-direction: column; }
.home-top { display: flex; justify-content: flex-end; align-items: center; gap: 16px; padding: 14px 20px; font-size: 14px; }
.home-top a { color: var(--fg); }
.home-top a:hover { text-decoration: underline; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #2f7d6d; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.hero { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 14vh 16px 0; gap: 28px; }
.hero .logo { font-size: clamp(52px, 12vw, 84px); }
.hero .field { max-width: 584px; }
.btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.btn { background: var(--hover); border: 1px solid transparent; border-radius: 6px; padding: 8px 16px; font-size: 14px; }
.btn:hover { border-color: var(--line); }
.foot { background: var(--hover); color: var(--muted); font-size: 14px; padding: 14px 20px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.foot nav { display: flex; gap: 20px; flex-wrap: wrap; }

/* Results */
.head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); padding: 16px 20px 0; }
.head-row { display: flex; align-items: center; gap: 24px; }
.head .logo { font-size: 28px; flex-shrink: 0; }
.head .field { max-width: 690px; }
.head .avatar { margin-left: auto; flex-shrink: 0; }
.tabs { display: flex; gap: 22px; padding-left: 132px; margin-top: 10px; font-size: 14px; overflow-x: auto; }
.tab { padding: 8px 2px 10px; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.results { max-width: 650px; padding: 12px 20px 48px 152px; display: flex; flex-direction: column; gap: 26px; }
.stats { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.res { min-width: 0; }
.site { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.fav { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }
.site-name { font-size: 14px; }
.site-url { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.res h3 { margin: 0 0 4px; font-size: 20px; font-weight: 400; line-height: 1.3; }
.res h3 a:hover { text-decoration: underline; }
.res h3 a:visited { color: var(--visited); }
.res p { margin: 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.paa { border-top: 1px solid var(--line); }
.paa h2 { font-size: 20px; font-weight: 400; margin: 16px 0 6px; }
.paa details { border-bottom: 1px solid var(--line); }
.paa summary { padding: 13px 0; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
.paa summary::after { content: "⌄"; color: var(--muted); }
.paa details[open] summary::after { content: "⌃"; }
.paa details p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.related h2 { font-size: 20px; font-weight: 400; margin: 0 0 12px; }
.rel-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.rel { display: flex; align-items: center; gap: 10px; background: var(--hover); border-radius: 22px; padding: 10px 16px; text-align: left; font-size: 14px; min-width: 0; }
.rel svg { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }
.pager { display: flex; align-items: center; justify-content: center; gap: 6px; font-variant-numeric: tabular-nums; }
.pager span { width: 32px; text-align: center; color: var(--link); }
.pager span.cur { color: var(--fg); font-weight: 700; }

@media (max-width: 900px) {
  .tabs { padding-left: 0; }
  .results { padding-left: 20px; }
}
@media (max-width: 600px) {
  .head-row { flex-wrap: wrap; gap: 12px; }
  .head .field { order: 3; flex-basis: 100%; }
  .results, .head { padding-inline: 16px; }
  .rel-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="home" id="home">
  <div class="home-top"><a href="#">Mail</a><a href="#">Images</a><div class="avatar" aria-hidden="true">Y</div></div>
  <div class="hero">
    <span class="logo">findly<span class="dot">.</span></span>
    <form class="field" id="home-form" role="search" autocomplete="off">
      <div class="bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7"/><path d="m20.5 20.5-5-5"/></svg>
        <input class="q" id="home-q" type="text" name="q" aria-label="Search" placeholder="Search the web" spellcheck="false" autofocus>
        <button class="clear" type="button" aria-label="Clear search" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="sugg" role="listbox" hidden></div>
    </form>
    <div class="btns">
      <button class="btn" type="button" id="home-go">Findly Search</button>
      <button class="btn" type="button" id="lucky">Surprise me</button>
    </div>
  </div>
  <footer class="foot"><span>Australia</span><nav><a href="#" style="color:inherit">About</a><a href="#" style="color:inherit">Privacy</a><a href="#" style="color:inherit">Terms</a><a href="#" style="color:inherit">Settings</a></nav></footer>
</div>

<div id="serp" hidden>
  <header class="head">
    <div class="head-row">
      <a class="logo" href="#" id="to-home" aria-label="Findly home">findly<span class="dot">.</span></a>
      <form class="field" id="serp-form" role="search" autocomplete="off">
        <div class="bar">
          <input class="q" id="serp-q" type="text" name="q" aria-label="Search" spellcheck="false">
          <button class="clear" type="button" aria-label="Clear search" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
          <button class="clear" type="submit" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="7"/><path d="m20.5 20.5-5-5"/></svg></button>
        </div>
        <div class="sugg" role="listbox" hidden></div>
      </form>
      <div class="avatar" aria-hidden="true">Y</div>
    </div>
    <nav class="tabs" aria-label="Result types">
      <a class="tab active" href="#">All</a><a class="tab" href="#">Images</a><a class="tab" href="#">News</a><a class="tab" href="#">Videos</a><a class="tab" href="#">Maps</a><a class="tab" href="#">Shopping</a>
    </nav>
  </header>
  <main class="results" id="results"></main>
</div>

<script>
(function () {
  var homeView = document.getElementById('home');
  var serpView = document.getElementById('serp');
  var results = document.getElementById('results');
  var serpQ = document.getElementById('serp-q');

  var SUGGEST = [
    'weather this weekend', 'cheap flights to bali', 'how to renew passport', 'best laptop for students',
    'gp clinic near me', 'how to lower electricity bill', 'easy chicken curry recipe', 'public holidays 2026',
    'how to change bank account details', 'rental bond refund', 'tax return deadline', 'local gym membership prices',
    'how to reset router', 'symptoms of flu vs cold', 'second hand cars for sale', 'running shoes for flat feet'
  ];
  var SITES = [
    ['everydayguide.net', 'Everyday Guide', '#2563eb'], ['askthelocals.com', 'Ask The Locals', '#c2410c'],
    ['homeandmoney.org', 'Home & Money', '#15803d'], ['quickanswers.io', 'Quick Answers', '#7c3aed'],
    ['communityforum.net', 'Community Forum', '#0e7490'], ['howitworks.wiki', 'HowItWorks Wiki', '#4b5563'],
    ['consumerchoice.au', 'Consumer Choice', '#b45309']
  ];

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'search'; }
  function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }

  /* Suggestions dropdown for each search form */
  function wireField(form, input, onSearch) {
    var box = form.querySelector('.sugg');
    var clear = form.querySelector('.clear[type="button"]');
    var hl = -1;
    function close() { box.hidden = true; form.classList.remove('open'); hl = -1; }
    function render() {
      var v = input.value.trim().toLowerCase();
      clear.hidden = input.value === '';
      var items = v ? SUGGEST.filter(function (s) { return s.indexOf(v) !== -1 && s !== v; }).slice(0, 6) : [];
      box.innerHTML = '';
      if (!items.length || document.activeElement !== input) return close();
      items.forEach(function (s) {
        var b = el('button'); b.type = 'button'; b.setAttribute('role', 'option');
        b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="7"/><path d="m20.5 20.5-5-5"/></svg>';
        b.append(el('span', null, s));
        b.addEventListener('mousedown', function (e) { e.preventDefault(); input.value = s; close(); onSearch(s); });
        box.append(b);
      });
      box.hidden = false; form.classList.add('open'); hl = -1;
    }
    input.addEventListener('input', render);
    input.addEventListener('focus', render);
    input.addEventListener('blur', function () { setTimeout(close, 100); });
    input.addEventListener('keydown', function (e) {
      var opts = box.querySelectorAll('button');
      if (box.hidden || !opts.length) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        hl = (hl + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length;
        opts.forEach(function (o, i) { o.classList.toggle('hl', i === hl); });
        input.value = opts[hl].textContent;
      } else if (e.key === 'Escape') { close(); }
    });
    clear.addEventListener('click', function () { input.value = ''; clear.hidden = true; input.focus(); close(); });
    form.addEventListener('submit', function (e) { e.preventDefault(); close(); onSearch(input.value); });
  }

  function buildResults(q) {
    var h = hash(q.toLowerCase());
    var Q = cap(q);
    var templates = [
      [Q + ' – Complete Guide (2026)', 'Everything you need to know about ' + q + ', explained step by step with practical tips, common mistakes to avoid and answers to frequent questions.'],
      [Q + ': What You Should Know', 'We looked into ' + q + ' and summarised the key points. Updated regularly with reader feedback and the latest information.'],
      ['Questions about ' + q + '? Here are real answers', 'Locals and experts share their experience with ' + q + '. Read the top-voted replies or ask your own question.'],
      ['How to: ' + q, 'A short, plain-English walkthrough of ' + q + '. Takes about 5 minutes to read, with checklists you can print.'],
      ['Compare options for ' + q, 'Side-by-side comparison of costs, pros and cons related to ' + q + '. Independent and not sponsored.'],
      [Q + ' – overview and history', 'An overview of ' + q + ', including background, how it works and links to further reading.']
    ];
    var out = [];
    for (var i = 0; i < templates.length; i++) {
      var s = SITES[(h + i * 3) % SITES.length];
      out.push({ site: s, title: templates[i][0], snippet: templates[i][1] });
    }
    return { list: out, count: (h % 900 + 100) * 1000 + (h % 997), secs: ((h % 60) / 100 + 0.21).toFixed(2) };
  }

  function search(raw) {
    var q = raw.trim();
    if (!q) return;
    document.dispatchEvent(new CustomEvent('findly:search', { detail: { query: q, at: new Date().toISOString() } }));
    homeView.hidden = true; serpView.hidden = false;
    serpQ.value = q;
    serpQ.closest('form').querySelector('.clear[type="button"]').hidden = false;
    document.title = q + ' – Findly Search';
    var data = buildResults(q);
    results.innerHTML = '';
    results.append(el('div', 'stats', 'About ' + data.count.toLocaleString('en-AU') + ' results (' + data.secs + ' seconds)'));

    data.list.forEach(function (r, i) {
      var box = el('article', 'res');
      var site = el('div', 'site');
      var fav = el('div', 'fav', r.site[1].charAt(0)); fav.style.background = r.site[2]; fav.setAttribute('aria-hidden', 'true');
      var meta = el('div'); meta.append(el('div', 'site-name', r.site[1]), el('div', 'site-url', 'https://' + r.site[0] + ' › ' + slug(q)));
      site.append(fav, meta);
      var h3 = el('h3'); var a = el('a', null, r.title); a.href = '#'; a.addEventListener('click', function (e) { e.preventDefault(); }); h3.append(a);
      box.append(site, h3, el('p', null, r.snippet));
      results.append(box);
      if (i === 1) {
        var paa = el('section', 'paa'); paa.append(el('h2', null, 'People also ask'));
        ['What is the easiest way to ' + q + '?', 'How much does it cost?', 'How long does it usually take?', 'Is there anything I should avoid?'].forEach(function (t) {
          var d = el('details'); d.append(el('summary', null, t), el('p', null, 'Most sources agree it depends on your situation. The guides below explain the common options and what to check first.'));
          paa.append(d);
        });
        results.append(paa);
      }
    });

    var rel = el('section', 'related'); rel.append(el('h2', null, 'People also search for'));
    var grid = el('div', 'rel-grid');
    [q + ' near me', q + ' cost', q + ' reviews', 'how to ' + q, q + ' tips', 'best ' + q].forEach(function (t) {
      var b = el('button', 'rel'); b.type = 'button';
      b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="7"/><path d="m20.5 20.5-5-5"/></svg>';
      b.append(el('span', null, t));
      b.addEventListener('click', function () { search(t); });
      grid.append(b);
    });
    rel.append(grid); results.append(rel);

    var pager = el('div', 'pager');
    for (var p = 1; p <= 10; p++) pager.append(el('span', p === 1 ? 'cur' : null, String(p)));
    results.append(pager);
    window.scrollTo(0, 0);
  }

  function goHome() {
    serpView.hidden = true; homeView.hidden = false;
    document.title = 'Findly Search';
    var hq = document.getElementById('home-q'); hq.value = ''; hq.focus();
  }

  wireField(document.getElementById('home-form'), document.getElementById('home-q'), search);
  wireField(document.getElementById('serp-form'), serpQ, search);
  document.getElementById('home-go').addEventListener('click', function () { search(document.getElementById('home-q').value); });
  document.getElementById('lucky').addEventListener('click', function () { search(SUGGEST[Math.floor(Math.random() * SUGGEST.length)]); });
  document.getElementById('to-home').addEventListener('click', function (e) { e.preventDefault(); goHome(); });
})();
</script>
</body>
</html>
